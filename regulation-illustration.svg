<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two panels. On the left, three figures queueing at a hospital doorway with arrows sorting them in two directions, labelled trier — to sort those who have arrived. On the right, a telephone handset by a dial marked 15, its cord running out as a heart-rhythm trace to an ambulance at a distant scene, labelled reguler — to decide before anyone arrives." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#FBF8F4"/>

  <!-- ═══════════ LEFT: TRIER ═══════════ -->
  <g transform="translate(40,40)">

    <path d="M254 250 L254 106 A46 46 0 0 1 346 106 L346 250 Z"
          fill="#E8EDF6" stroke="#2F4A7C" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M300 250 L300 106" stroke="#2F4A7C" stroke-width="2" opacity=".45"/>
    <g fill="#9E2B2B">
      <rect x="292" y="58" width="16" height="42" rx="3"/>
      <rect x="279" y="71" width="42" height="16" rx="3"/>
    </g>

    <g fill="#2F4A7C">
      <circle cx="66" cy="172" r="18"/>
      <path d="M44 250 C44 210 53 196 66 196 C79 196 88 210 88 250 Z"/>
      <circle cx="126" cy="172" r="18"/>
      <path d="M104 250 C104 210 113 196 126 196 C139 196 148 210 148 250 Z"/>
      <circle cx="186" cy="172" r="18"/>
      <path d="M164 250 C164 210 173 196 186 196 C199 196 208 210 208 250 Z"/>
    </g>

    <g stroke="#9E2B2B" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 158 C248 138 272 132 296 132"/>
      <path d="M284 122 L298 132 L284 142"/>
      <path d="M218 212 C248 232 272 238 296 238"/>
      <path d="M284 228 L298 238 L284 248"/>
    </g>

    <line x1="16" y1="250" x2="364" y2="250" stroke="#DCD7CE" stroke-width="3"/>
    <text x="190" y="294" text-anchor="middle"
          font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="29"
          font-style="italic" fill="#22242E">trier</text>
    <text x="190" y="320" text-anchor="middle"
          font-family="Helvetica Neue, Arial, sans-serif" font-size="13"
          letter-spacing="1.5" fill="#6B6A74">TO SORT THOSE WHO HAVE ARRIVED</text>
  </g>

  <line x1="450" y1="72" x2="450" y2="326" stroke="#DCD7CE" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- ═══════════ RIGHT: RÉGULER ═══════════ -->
  <g transform="translate(480,40)">

    <!-- handset, upper left -->
    <g fill="#2F4A7C">
      <path d="M34 82 C34 66 48 55 64 59 L84 64 C95 67 99 79 93 88 L84 103
               C80 109 73 111 68 107 L54 99 C41 104 34 93 34 82 Z"/>
      <path d="M142 146 C158 150 165 164 160 177 L151 195 C146 205 131 207 122 200
               L108 188 C101 182 101 172 108 166 L122 154 C128 149 135 144 142 146 Z"/>
      <path d="M81 90 C92 115 116 140 140 154"
            stroke="#2F4A7C" stroke-width="14" fill="none" stroke-linecap="round"/>
    </g>

    <!-- the dial -->
    <g transform="translate(46,178)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#2F4A7C" stroke-width="3" opacity=".55"/>
      <text x="0" y="9" text-anchor="middle"
            font-family="Helvetica Neue, Arial, sans-serif" font-size="25"
            font-weight="600" fill="#2F4A7C">15</text>
    </g>

    <!-- cord leaving the handset, becoming a rhythm, running to the scene -->
    <path d="M156 190 C158 204 150 212 138 212 L118 212"
          stroke="#2F4A7C" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M118 212 L150 212 L160 212 L169 194 L182 236 L192 206 L200 212 L228 212
             L238 212 L247 194 L260 236 L270 206 L278 212 L318 212"
          stroke="#9E2B2B" stroke-width="3.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M308 202 L322 212 L308 222"
          stroke="#9E2B2B" stroke-width="3.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the scene at the far end -->
    <g transform="translate(272,120)">
      <rect x="22" y="14" width="58" height="32" rx="6"
            fill="#E8EDF6" stroke="#2F4A7C" stroke-width="3"/>
      <path d="M22 24 L2 24 C-4 24 -8 28 -8 34 L-8 46 L22 46 Z"
            fill="#E8EDF6" stroke="#2F4A7C" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="6" cy="48" r="7.5" fill="#22242E"/>
      <circle cx="64" cy="48" r="7.5" fill="#22242E"/>
      <g fill="#9E2B2B">
        <rect x="47" y="21" width="7" height="18" rx="2"/>
        <rect x="41" y="27" width="19" height="7" rx="2"/>
      </g>
      <rect x="-6" y="3" width="17" height="8" rx="4" fill="#9E2B2B" opacity=".85"/>
    </g>

    <line x1="16" y1="250" x2="364" y2="250" stroke="#DCD7CE" stroke-width="3"/>
    <text x="190" y="294" text-anchor="middle"
          font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="29"
          font-style="italic" fill="#22242E">réguler</text>
    <text x="190" y="320" text-anchor="middle"
          font-family="Helvetica Neue, Arial, sans-serif" font-size="13"
          letter-spacing="1.5" fill="#6B6A74">TO DECIDE BEFORE ANYONE ARRIVES</text>
  </g>
</svg>
